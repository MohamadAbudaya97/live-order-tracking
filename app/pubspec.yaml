name: live_order_tracking
description: Customer, store and courier views of one order, kept in sync over REST and Socket.IO.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  dio: ^5.11.1
  equatable: ^3.0.0
  flutter_bloc: ^9.1.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  socket_io_client: ^3.1.6
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  bloc_test: ^10.0.0
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
